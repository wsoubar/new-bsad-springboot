<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Gerenciador de Produtos</title>

  <!-- Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Seu CSS personalizado (opcional) -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h1 class="h4 mb-0" th:text="${title}">Título da Página</h1>
    </div>

    <div class="card-body">
      <!-- Formulário Estilizado -->
      <form method="post" th:action="@{/products}" class="row g-3 mb-4">
        <div class="col-md-5">
          <input type="text" name="name" class="form-control" placeholder="Product name" required />
        </div>
        <div class="col-md-5">
          <input type="text" name="brand" class="form-control" placeholder="Brand" required />
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-success w-100">Add Product</button>
        </div>
      </form>

      <!-- Tabela Estilizada -->
      <div class="table-responsive">
        <table class="table table-hover table-bordered table-striped">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Brand</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="p : ${products}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.name}">Sample</td>
            <td th:text="${p.brand}">ACME</td>
          </tr>
          <tr th:if="${#lists.isEmpty(products)}">
            <td colspan="3" class="text-center text-muted">Nenhum produto encontrado.</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card-footer text-muted">
      <small>
        <strong>REST:</strong> <code class="bg-light p-1">GET /api/products</code> |
        <strong>SOAP WSDL:</strong> <code class="bg-light p-1">/services/hello?wsdl</code>
      </small>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle JS (opcional, necessário para componentes interativos) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
